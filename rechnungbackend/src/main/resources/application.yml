spring:
  application:
    name: RechnungBackend

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=Firma;encrypt=true;trustServerCertificate=true
    username: sa
    password: ffbberr$1
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false


server:
  port: 8080


springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true


